name: Read-only Self-Service Catalog Sync
run-name: Catalog sync ${{ inputs.run_id }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'UUID of the queued run created by the protected Plan admin API'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: plan-read-only-self-service
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'Ahmedamir21/Plan'
    runs-on: ubuntu-latest
    environment: self-service-sync
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned worker dependencies
        run: npm --prefix app ci
      - name: Claim lease, read approved catalog, validate and stage
        run: npm --prefix app run sync:worker
        env:
          PLANORA_SYNC_RUN_ID: ${{ inputs.run_id }}
          PLANORA_SELF_SERVICE_ENABLED: ${{ vars.PLANORA_SELF_SERVICE_ENABLED }}
          PLANORA_TERM_KEY: ${{ vars.PLANORA_TERM_KEY }}
          DATABASE_URL: ${{ secrets.PLANORA_WORKER_DATABASE_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
          SELF_SERVICE_CATALOG_TOKEN: ${{ secrets.SELF_SERVICE_CATALOG_TOKEN }}
          SELF_SERVICE_USERNAME: ${{ secrets.SELF_SERVICE_USERNAME }}
          SELF_SERVICE_PASSWORD: ${{ secrets.SELF_SERVICE_PASSWORD }}
      # No screenshots, traces, cookies, HTML, raw response bodies or private artifacts.
      # The workflow never publishes. A verified admin approves the staged SQL proposal.
