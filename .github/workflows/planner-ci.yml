name: Planner CI
on:
  push:
    branches: [main, 'planora-*', 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_setup_ack:
        description: 'Optional: type Plan isolated preview only to run the protected Plan Preview setup'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Ahmedamir21/Plan'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: planora_test
          POSTGRES_USER: postgres
          # Disposable isolated test credential, never a real database or university secret.
          POSTGRES_PASSWORD: planora_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d planora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:planora_test_only@localhost:5432/planora_test
      DATABASE_SSL: disable
      PLANORA_EMAIL_MODE: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            sync/package-lock.json
            Final_Fall_2026_ZewailCity/Templates-Final-Final-main/Zewail-City-Templates-arena-01a09711-zewail-city-templates/Final_Fall_2026_ZewailCity/Final_Fall_2026_Zewail/package-lock.json
      - name: Install locked packages
        run: |
          npm --prefix app ci
          npm --prefix sync ci
          npm --prefix Final_Fall_2026_ZewailCity/Templates-Final-Final-main/Zewail-City-Templates-arena-01a09711-zewail-city-templates/Final_Fall_2026_ZewailCity/Final_Fall_2026_Zewail ci
      - name: Server checks and real PostgreSQL integration tests
        run: npm --prefix app run typecheck && npm --prefix app test
      - name: Read-only agent tests (synthetic data only)
        run: npm --prefix sync run check && npm --prefix sync test
      - name: Production dependency audits
        run: |
          npm --prefix app audit --omit=dev --audit-level=high
          npm --prefix sync audit --omit=dev --audit-level=high
          npm --prefix Final_Fall_2026_ZewailCity/Templates-Final-Final-main/Zewail-City-Templates-arena-01a09711-zewail-city-templates/Final_Fall_2026_ZewailCity/Final_Fall_2026_Zewail audit --omit=dev --audit-level=high
      - name: Planner typecheck, build and all regression suites
        working-directory: Final_Fall_2026_ZewailCity/Templates-Final-Final-main/Zewail-City-Templates-arena-01a09711-zewail-city-templates/Final_Fall_2026_ZewailCity/Final_Fall_2026_Zewail
        run: |
          npm run typecheck
          npm run build
          for script in test:platform test:data test:assistant test:admin test:completeness test:admin-ui test:import test:patch test:patch-ui test:english test:english-import test:audit test:ssr test:ui test:harness test:catalog test:sync-ui test:notifications-ui test:production-ui; do npm run "$script"; done
      - name: Controlled browser/API/SQL new-section and changed-time acceptance
        run: npm --prefix app run test:e2e
      - name: Full tooling audit (known unpatched dev-only braces advisory; see SECURITY)
        working-directory: Final_Fall_2026_ZewailCity/Templates-Final-Final-main/Zewail-City-Templates-arena-01a09711-zewail-city-templates/Final_Fall_2026_ZewailCity/Final_Fall_2026_Zewail
        run: npm audit --audit-level=high
        continue-on-error: true

  preview_acceptance:
    # Never runs on PR/push or main; this existing workflow can be dispatched on the PR branch.
    if: github.repository == 'Ahmedamir21/Plan' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/arena/cd36c549-plan' && inputs.preview_setup_ack == 'Plan isolated preview only'
    needs: verify
    runs-on: ubuntu-24.04
    environment: plan-preview
    timeout-minutes: 25
    concurrency:
      group: plan-pr-2-isolated-preview
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - name: Verify scope, initialize isolated services, deploy Preview, run deployed smoke
        run: npm --prefix app run preview:setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_PREVIEW_ACK: ${{ inputs.preview_setup_ack }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PLAN_PREVIEW_VERCEL_PROJECT_ID: ${{ vars.PLAN_PREVIEW_VERCEL_PROJECT_ID }}
          PLAN_PREVIEW_DATABASE_OWNER_URL: ${{ secrets.PLAN_PREVIEW_DATABASE_OWNER_URL }}
          PLAN_PREVIEW_DATABASE_RUNTIME_URL: ${{ secrets.PLAN_PREVIEW_DATABASE_RUNTIME_URL }}
          PLAN_PREVIEW_REDIS_URL: ${{ secrets.PLAN_PREVIEW_REDIS_URL }}
          PLAN_PREVIEW_REDIS_TOKEN: ${{ secrets.PLAN_PREVIEW_REDIS_TOKEN }}
          PLAN_PREVIEW_ADMIN_PASSWORD: ${{ secrets.PLAN_PREVIEW_ADMIN_PASSWORD }}
          PLAN_PREVIEW_SECOND_ADMIN_PASSWORD: ${{ secrets.PLAN_PREVIEW_SECOND_ADMIN_PASSWORD }}
          PLANORA_SQL_CUTOVER_APPROVED: 'false'
          PLANORA_SELF_SERVICE_ENABLED: 'false'
          PLANORA_EMAIL_MODE: disabled
          PLANORA_EMAIL_LIVE_APPROVED: 'false'
          PLANORA_SECURITY_MAIL_ENABLED: 'false'
