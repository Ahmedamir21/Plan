name: Planner CI

on:
  push:
    branches: [main, 'planora-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Final_Fall_2026_ZewailCity/Templates-Final-Final-main/Zewail-City-Templates-arena-01a09711-zewail-city-templates/Final_Fall_2026_ZewailCity/Final_Fall_2026_Zewail

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Final_Fall_2026_ZewailCity/Templates-Final-Final-main/Zewail-City-Templates-arena-01a09711-zewail-city-templates/Final_Fall_2026_ZewailCity/Final_Fall_2026_Zewail/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Self-Service scraper syntax check
        working-directory: .
        run: node --check sync/self-service-sync.mjs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit report
        run: npm audit --audit-level=high --json > npm-audit.json || true

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: Final_Fall_2026_ZewailCity/Templates-Final-Final-main/Zewail-City-Templates-arena-01a09711-zewail-city-templates/Final_Fall_2026_ZewailCity/Final_Fall_2026_Zewail/npm-audit.json
          if-no-files-found: error

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Platform feature tests
        run: npm run test:platform

      - name: Data integrity tests
        run: npm run test:data

      - name: Assistant feature tests
        run: npm run test:assistant

      - name: Admin login tests
        run: npm run test:admin
      - name: Published data completeness report
        run: npm run test:completeness

      - name: Admin course search tests
        run: npm run test:admin-ui

      - name: Times and rooms CSV import tests
        run: npm run test:patch && npm run test:patch-ui

      - name: Optional English course readiness
        run: npm run test:english && npm run test:english-import

      - name: Scheduling engine audit
        run: npm run test:audit

      - name: SSR smoke test
        run: npm run test:ssr

      - name: UI tests
        run: npm run test:ui

      - name: Core scheduler harness
        run: npm run test:harness
