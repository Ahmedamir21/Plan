name: Optional Academic Email Delivery
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: plan-academic-email-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'Ahmedamir21/Plan' && vars.PLANORA_EMAIL_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: notifications
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - name: Process bounded email batch
        run: npm --prefix app run notifications:deliver
        env:
          DATABASE_URL: ${{ secrets.PLANORA_EMAIL_DATABASE_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
          PLANORA_EMAIL_MODE: ${{ vars.PLANORA_EMAIL_MODE }}
          PLANORA_EMAIL_LIVE_APPROVED: ${{ vars.PLANORA_EMAIL_LIVE_APPROVED }}
          PLANORA_PUBLIC_URL: ${{ vars.PLANORA_PUBLIC_URL }}
          PLANORA_EMAIL_FROM: ${{ vars.PLANORA_EMAIL_FROM }}
          PLANORA_EMAIL_TEST_RECIPIENT: ${{ secrets.PLANORA_EMAIL_TEST_RECIPIENT }}
          PLANORA_EMAIL_TOKEN_SECRET: ${{ secrets.PLANORA_EMAIL_TOKEN_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
